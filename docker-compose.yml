services:
  app:
    # 재시작 정책은 기동 대상 서비스 전체에 같은 값을 둡니다. db 만 always 이고
    # 나머지가 비어 있으면 앱이나 워커가 죽었을 때 DB 만 살아남아 부분 가동
    # 상태가 조용히 이어집니다. unless-stopped 는 사람이 명시로 멈춘 것은
    # 존중하므로 측정 중 수동 정지를 되살리지 않습니다.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    # Uvicorn 워커 프로세스 수는 WEB_CONCURRENCY 로 조정합니다. 기본값은
    # 안전값 1입니다. 로컬(비 Docker) 실측에서 3워커가 유망해 보였지만,
    # 실제 Docker 재기동 실측(docs/ops/uvicorn_worker_scaling_candidate_20260813.md
    # 4장)에서 3워커 c10 P95 127.32ms/반복 151.82ms, 4워커 c10 P95 165.92ms로
    # 둘 다 100ms 목표에 실패해 기본값 채택을 철회했습니다. 3워커 이상은
    # WEB_CONCURRENCY 로 수동 실험할 때만 사용하십시오. 배열(exec) 형태라
    # 셸을 거치지 않으므로 값에 셸 확장이나 명령 주입 여지가 없고, 그대로
    # --workers 인자 하나로만 전달됩니다. Dockerfile 의 CMD(단일 워커)는
    # 그대로 두어 `docker run` 직접 실행과 개발/테스트 계약을 건드리지
    # 않습니다.
    command:
      - python3
      - -m
      - uvicorn
      - src.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${WEB_CONCURRENCY:-1}"
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      # 이미지에 .env 를 넣지 않으므로(.dockerignore) 설정은 전부 여기서 전달합니다.
      # ENVIRONMENT=production 이면 Settings 가 이 값을 필수로 검증하며, 비어 있거나
      # 와일드카드면 기동을 거부합니다. 전달하지 않으면 컨테이너가 기동 즉시 죽습니다.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CORS_DEV_ALLOW_ALL=${CORS_DEV_ALLOW_ALL:-true}
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@db:3306/procurement
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - REDIS_URL=redis://redis:6379/0
      - MEILI_ENABLED=true
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      # 생성 LLM 은 호스트에서 구동 중인 Ollama 를 재사용합니다 (macOS Metal 가속 유지).
      # .env 의 CHROMA_DB_PATH 는 호스트 절대 경로입니다. 이미지에 그대로 실려
      # 컨테이너가 없는 경로를 보고 빈 컬렉션을 만들었습니다. 반드시 덮어씁니다.
      - CHROMA_DB_PATH=/app/chroma_db
      # 모델 로드 직후 gc.freeze() 로 가중치를 영구 세대로 옮겨 generation-2
      # 순회에서 제외합니다. c10 최악 P99 108.55 -> 59.32ms, 100ms 초과 21건 ->
      # 0건(1,800 요청), P50 변화 없음, 10분 지속 부하 RSS 평평.
      # 근거: docs/ops/phase8_predict_gc_verdict_20260814.md
      # 되돌리려면 PREDICTION_GC_MODE= 로 빈 값을 명시하십시오. `:-` 가 아니라
      # `-` 를 쓰는 이유가 이것입니다. `:-` 는 빈 문자열도 미설정으로 보아
      # freeze 로 되돌려 버리므로 끌 수단이 없어집니다.
      # batch-disable 은 기각됐으니 운영에 쓰지 마십시오(기본보다 꼬리가 나쁩니다).
      - PREDICTION_GC_MODE=${PREDICTION_GC_MODE-freeze}
      - LATENCY_SEGMENT_LOGGING=${LATENCY_SEGMENT_LOGGING:-false}
      - NGRAM_PREFILTER_ENABLED=${NGRAM_PREFILTER_ENABLED:-false}
      # 정본은 G2B_SERVICE_KEY이며, 기존 .env 의 serviceKey 도 호환을 위해 전달합니다.
      - G2B_SERVICE_KEY=${G2B_SERVICE_KEY:-}
      - serviceKey=${serviceKey:-}
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-refac_bid_box}
      - OTEL_EXPORTER_TYPE=${OTEL_EXPORTER_TYPE:-none}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_METRIC_EXPORT_INTERVAL_MILLIS=${OTEL_METRIC_EXPORT_INTERVAL_MILLIS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3); assert json.load(response)['status'] in ('ready', 'degraded')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    volumes:
      - ./src:/app/src
      - ./ml_registry:/app/ml_registry
      - ./data:/app/data
      # 마운트하지 않으면 이미지 빌드 시점에 구워진 낡은 색인을 보게 됩니다.
      # 호스트에서 KB 를 확대해도 컨테이너 챗봇에는 반영되지 않습니다.
      - ./chroma_db:/app/chroma_db

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["arq", "src.tasks.worker.WorkerSettings"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      # 워커는 HTTP 를 받지 않아 CORS 자체는 쓰지 않지만, Settings 검증은 프로세스
      # 공통이라 이 값이 없으면 production 에서 워커도 기동하지 못합니다.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CORS_DEV_ALLOW_ALL=${CORS_DEV_ALLOW_ALL:-true}
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@db:3306/procurement
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - REDIS_URL=redis://redis:6379/0
      - MEILI_ENABLED=true
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      - CHROMA_DB_PATH=/app/chroma_db
      # 정본은 G2B_SERVICE_KEY이며, 기존 .env 의 serviceKey 도 호환을 위해 전달합니다.
      - G2B_SERVICE_KEY=${G2B_SERVICE_KEY:-}
      - serviceKey=${serviceKey:-}
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-refac_bid_box}
      - OTEL_EXPORTER_TYPE=${OTEL_EXPORTER_TYPE:-none}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_METRIC_EXPORT_INTERVAL_MILLIS=${OTEL_METRIC_EXPORT_INTERVAL_MILLIS:-60000}
      # 개발 DB와 KB는 매일 최신화하되, 예측 검증·재학습은 운영 스케줄에만 둡니다.
      - NGRAM_PREFILTER_ENABLED=${NGRAM_PREFILTER_ENABLED:-false}
      - AUTOMATION_DATA_REFRESH_SCHEDULE_ENABLED=true
      - AUTOMATION_NIGHTLY_SCHEDULE_ENABLED=false
      # 일일 수집 크론은 02:00 에만 돌기 때문에, 그 시각에 스택이 내려가 있었으면
      # 그날치는 영영 비어 있고 재기동으로도 메워지지 않습니다. 2026-08-27 이후
      # 스택이 꺼져 있는 동안 8일치 공백이 생긴 것이 이 경우입니다. 따라잡기는
      # 마지막 collected_at 이 24시간을 넘겼을 때만 1회 실행되고 6시간 쿨다운이
      # 걸리므로, 재시작 반복으로 수집이 중복해서 돌지 않습니다.
      - AUTOMATION_SCHEDULE_CATCHUP_ENABLED=true
      - ML_WEEKLY_RETRAIN_ENABLED=false
      # Arq cron 은 워커의 로컬 시간을 사용하므로 운영 문서의 02:00을 KST로 고정합니다.
      - TZ=Asia/Seoul
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./ml_registry:/app/ml_registry
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

  # 동결된 React 스캐폴드입니다. docs/design/FRONTEND_DECISION.md 에 따라
  # 정본 UI 는 SSR(Jinja2) 이며 원본과 디자인이 다른 이 서비스는 기본 기동에서 제외합니다.
  # 참조가 필요할 때만 다음으로 띄웁니다: docker compose --profile legacy up -d frontend
  frontend:
    profiles: ["legacy"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://app:8000
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy


  db:

    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-redo-log-capacity=2147483648
      --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-2147483648}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: procurement
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    restart: unless-stopped
    image: getmeili/meilisearch:v1.14@sha256:8cd411ba5d9ec2dfce02e241305208eebacce0fd74a72bece21cadd03dc566ce
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 관측성 스택 (opt-in). 기본 기동 대상이 아니며 프로파일을 명시할 때만 뜹니다.
  #
  #   docker compose --profile observability up -d
  #   make observability-up
  #
  # 기본값에서 빼는 이유는 개발 기동 비용입니다. 네 서비스가 항상 뜨면 평범한
  # 개발과 테스트에서도 메모리와 기동 시간을 쓰는데, 관측성이 필요한 때는
  # 레이턴시 조사와 추적 확인처럼 한정된 상황입니다. 운영(docker-compose.prod.yml)은
  # 종전대로 항상 띄웁니다.
  #
  # 앱에서 추적을 내보내려면 .env 에 OTEL_ENABLED=true 와
  # OTEL_EXPORTER_TYPE=otlp 를 두고 엔드포인트를 컨테이너 이름으로 지정하십시오.
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
  # 운영과 달리 alertmanager 는 두지 않습니다. Slack 수신자 비밀 파일을 요구하는
  # 호출 경로라 로컬에서 호출할 대상이 없습니다. 그래서 Prometheus 설정도
  # alerting 블록이 없는 docker/prometheus.dev.yml 을 씁니다.
  otel-collector:
    profiles: ["observability"]
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.141.0@sha256:b14234c4bc1b7364629af272e564913bb57bdc9736d45b8b6db5ab3417dc75f9
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_started

  tempo:
    profiles: ["observability"]
    restart: unless-stopped
    image: grafana/tempo:2.9.2@sha256:3f0825e14397d3459e11e96f99ddd3976ec0cb75e328459e173298d9fb74b407
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  prometheus:
    profiles: ["observability"]
    restart: unless-stopped
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    profiles: ["observability"]
    restart: unless-stopped
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    environment:
      # 로컬 전용 기본값입니다. 운영은 GF_SECURITY_ADMIN_PASSWORD 를 필수로 요구합니다.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
  tempo_data:
  prometheus_data:
  grafana_data:
