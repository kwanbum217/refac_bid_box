version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/procurement
      - REDIS_URL=redis://redis:6379/0
      # 생성 LLM 은 호스트에서 구동 중인 Ollama 를 재사용합니다 (macOS Metal 가속 유지).
      # .env 의 CHROMA_DB_PATH 는 호스트 절대 경로입니다. 이미지에 그대로 실려
      # 컨테이너가 없는 경로를 보고 빈 컬렉션을 만들었습니다. 반드시 덮어씁니다.
      - CHROMA_DB_PATH=/app/chroma_db
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma4:e4b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./ml_registry:/app/ml_registry
      - ./data:/app/data
      # 마운트하지 않으면 이미지 빌드 시점에 구워진 낡은 색인을 보게 됩니다.
      # 호스트에서 KB 를 확대해도 컨테이너 챗봇에는 반영되지 않습니다.
      - ./chroma_db:/app/chroma_db

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["arq", "src.tasks.worker.WorkerSettings"]
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/procurement
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_DB_PATH=/app/chroma_db
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma4:e4b
      # 개발 스택 기동만으로 수집과 재학습이 실행되지 않도록 막습니다.
      - AUTOMATION_NIGHTLY_SCHEDULE_ENABLED=false
      - ML_WEEKLY_RETRAIN_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./ml_registry:/app/ml_registry
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

  # 동결된 React 스캐폴드입니다. docs/design/FRONTEND_DECISION.md 에 따라
  # 정본 UI 는 SSR(Jinja2) 이며 원본과 디자인이 다른 이 서비스는 기본 기동에서 제외합니다.
  # 참조가 필요할 때만 다음으로 띄웁니다: docker compose --profile legacy up -d frontend
  frontend:
    profiles: ["legacy"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://app:8000
    ports:
      - "5173:5173"
    depends_on:
      - app


  db:

    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-redo-log-capacity=2147483648
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: procurement
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
