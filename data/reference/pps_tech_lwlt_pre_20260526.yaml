scope: PPS_SERVC_TECH_QUAL_PRE_20260526
title: >
  조달청 기술용역 적격심사 세부기준 시행일 2026-05-26 이전 시행판의 입찰가격 별표 명세
  (시행 2025-09-01 ~ 2026-05-25)
predecessor: data/reference/pps_servc_tech_qual_history_2015_2022.yaml
predecessor_note: >
  선행 명세(PPS_SERVC_TECH_QUAL_HISTORY_V1)는 2015-11-19 ~ 2025-08-31 시행판을 담고
  그 gaps 에 "다음 시행판은 조달청지침 제6352호(시행 2025-09-01)" 로 남겼다.
  이 명세는 그 뒤를 잇는 2025-09-01 ~ 2026-05-25 시행판만 담는다. 선행 파일은 수정하지 않는다.

conventions:
  score_formula: P = B - k * |base_ratio/100 - bid_price/estimated_price| * 100
  lwlt_formula: base_ratio - (100 - pass_score) / k
  lwlt_notation: '계산값을 소수 둘째 자리까지 버린 뒤 0.005 를 뺀 .995 표기 관행. 예: 80.000 -> 79.995, 87.500 -> 87.495'
  lwlt_basis: 낙찰하한율은 고시 조문·별표에 인쇄되어 있지 않다. 이 명세의 derived_lwlt_rate 는 위 lwlt_formula 로 역산한 파생값이다.
  lwlt_term_absence: 원문 본문·별표에 '낙찰하한율' 이라는 문자열이 한 번도 나오지 않는다(판독 텍스트에서 0회). 별표가 인쇄하는 것은 기준비율, 평점계수, 배점한도, 그리고 평점 평탄 문구의 비율이다.
  announcement_field: >
    공고에 실리는 낙찰하한율은 나라장터 공고 항목 sucsfbidLwltRate 다.
    세부기준은 그 값을 직접 인쇄하지 않으므로, 이 명세는 공고 값을 원문 값으로 취급하지 않고
    별표의 기준비율·평점계수·평점 평탄 비율만 원문 값으로 적는다.
  flat_ratio: 별표 예외사항이 '입찰가격이 예정가격 이하로서 (예정가격의) 100분의 N 이상인 경우의 평점은 M점' 으로 인쇄한 평탄 비율이다. 네 구간 모두 인쇄되어 있다.
  lower_inclusive: true
  upper_exclusive: true
  boundary_token: 고시금액(용역)은 국가계약법 시행령에 따른 연도별 고시금액이다. 추정가격 구간 경계는 문자열 '고시금액' 으로 적는다.
  money_unit: KRW
  band_axes: >
    기술용역 별표1 은 배점한도 B 와 평점계수 k 가 같은 추정가격 구간
    (10억원 이상 / 10억원 미만 5억원 이상 / 5억원 미만 고시금액 이상 / 고시금액 미만)을 쓴다.
    통과점수는 본문 제4조 제1항이 추정가격 10억원 이상 92점, 10억원 미만 95점으로 나눈다.
  applies_from_announcement: >
    부칙 제2조(적용례)에 따라 시행일 이후 최초 입찰공고분부터 적용한다.
    공고일이 시행일보다 이르면 그 공고에는 이전 시행판이 적용된다.

