findings:
  official_rule_exists: true
  official_rule_name: 조달청 기술용역 적격심사 세부기준
  document_numbers:
  - 조달청지침 제6352호 (시행 2025-09-01)
  - 조달청지침 제654호 (시행 2026-01-26)
  rule_scope: 조달청이 집행하는 기술용역 입찰의 낙찰자 결정. 계약예규 「적격심사기준」 제6조에 따른다.
  lwlt_location: 별표
  lwlt_location_detail: >
    하한율 계열 값은 별표1 '심사항목 및 배점한도' 의 입찰가격 항목에 있다. 구간마다 기준비율(88/100),
    입찰가격 평점 개산식, 그리고 '입찰가격이 예정가격이하로서 (예정가격의) 100분의 N이상인 경우의
    평점은 M점으로 한다' 는 평점 평탄 문구가 인쇄되어 있다. 값은 공고별로 달라지지 않고 별표에 고정된다.
  announcement_value_relation: >
    공고 항목 sucsfbidLwltRate 는 세부기준이 직접 인쇄하지 않는다. 별표의 기준비율·평점계수·통과점수에서
    위 lwlt_formula 로 유도되는 값과 표기 관행이 같은 자리에서 나오지만, 그 유도 관계를 원문이 문장으로
    적어 두지는 않았다. 그래서 이 명세는 관계를 확정하지 않고 파생값으로만 적는다.
  term_absence_evidence: >
    '낙찰하한율' 문자열은 제8983호·제6352호·제654호·제5283호 판독 텍스트에서 모두 0회다.
  pre_2025_09_01_reference: >
    2025-09-01 직전 시행판은 조달청지침 제8983호(시행 2022-11-01)다. 별표1 의 기준비율과 평점 평탄 비율이
    제6352호·제654호와 같아, 2022-11-01 ~ 2026-05-25 동안 하한 계열 별표 값은 한 번도 바뀌지 않았다.
  code_change: 없음. 규칙 코드·발행 원장·CURRENT_STATE.md 를 수정하지 않았다.
  verdict: candidate
  verdict_reason: >
    공식 원문과 인용 문장은 확보했다. 다만 별표 값과 공고 값(sucsfbidLwltRate)을 잇는 방법, 그리고
    구판을 규칙 코드에 넣을지는 사용자 결정 사항이라 candidate 로 둔다.

