schema: INSTITUTION_QUANT_TABLE_SPEC_V1
version: "1.0.0"
created_at: "2026-10-13"
source_task: task_4a45d25ad668
scope: INSTITUTION
purpose: >
  기관 규칙이 확정된 10곳(국토교통부, 국가유산청, 환경부, 한국농어촌공사, 한국가스공사,
  한국수력원자력, 한국지역난방공사, 한국석유공사, 인천국제공항공사, 인천공항시설관리)의
  적격심사 세부기준 원문에서 별표별 정량평가 배점표(심사항목 배점한도와 세부 평가기준)를
  기계 판독 형태로 옮긴 명세다. 운영 코드(src/app/services/evaluation_rules.py)는 바꾸지
  않는다. 후속 과업이 이 명세를 규칙의 quant_basis=AGENCY_DOCUMENT 로 옮긴다.
related:
  rule_registry: "data/reference/institution_rules_20261013.yaml"
  rule_registry_doc: "docs/analysis/institution_rules_apply_20261013.md"
  code_quant_format: "src/app/services/evaluation_rules.py QuantScoreTable(6797-6820), QUANT_SCORE_TABLES(7355-7385)"
  code_quant_reference_doc: "docs/analysis/servc_pre_rules_2025_2026_tables_20260929.md"
conventions:
  item_kinds:
    score: "합계 산입 정량 배점항목"
    reputation: "신인도. 가점/감점 범위이며 원문 계·합계에는 0으로 산입한다"
    penalty: "결격사유. 감점 항목이라 합계 검산에서 제외한다"
    absent: "원문 배점표에 '-' 로 표기된 항목(입력 불가)"
    range: "원문이 범위(예: 10점 이상 30점 이하)로 표기한 항목"
  total_rule: "신인도·결격사유를 제외한 배점한도 합 + 입찰가격 배점한도 = 별표 합계(보통 100)"
  band_axis: "추정가격 구간. 기관 원문 표기가 5억원/고시금액/30억원 등으로 다르면 원문 문구를 band_label 에 그대로 쓴다"
  money_unit: "KRW"
  source_notation: "<key>#rows<a>-<b> 는 sources[key] 파일의 표 행 번호다. 행 추출은 scripts/extract_score_params.py 의 extract_document_text 를 썼다"
  no_guess: "원문에 없는 값은 넣지 않는다. 항목이 원문에 없으면 absent 로 두거나 항목 자체를 적지 않고 사유를 note 에 남긴다"
sources:
  molit: ".cache/inst_originals/task_889fe5b87a19/molit/molit_yongyeok_2018-01-04.hwp"
  molit_txt: ".cache/inst_originals/task_889fe5b87a19/molit/molit_yongyeok_2018-01-04.txt"
