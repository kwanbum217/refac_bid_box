institutions:
  - institution_name: "국토교통부"
    standard: "용역적격심사 및 협상에 의한 낙찰자 결정기준 (국토교통부훈령 제965호, 2018-01-04)"
    quant_table_status: confirmed
    note: >
      별표 1 은 당해용역수행능력을 건설기술진흥법 시행규칙 별표 2~3 발주청 평가기준으로
      평가하고, 고시금액 미만 구간만 부표로 세부 심사항목(참여기술자 50, 유사용역수행실적
      34 또는 경영상태 34, 용역업무 중복정도 12, 신용도 4)을 인쇄한다. 세부 평가기준의
      등급별 점수는 원문 부표에 있다. 별표 2(제안서 평가)는 협상에 의한 계약의 제안서
      평가표라 적격심사 정량 배점표가 아니므로 이 명세에서 제외한다.
    rules:
      - rule_id: "SERVC_INST_MOLIT_20180104_GENERAL"
        service_type: "일반용역"
        attachment: "별표 1"
        table_name: "적격심사항목 및 배점한도액"
        source: "molit#rows4-11; molit_txt:83-105"
        bands:
          - band_key: "notice_under"
            band_label: "추정가격 고시금액 미만인 용역"
            total_limit: 100
            items:
              - {name: "당해 용역 수행능력", limit: 30, limit_kind: score, source: "molit#rows5-6"}
              - {name: "입찰가격", limit: 70, limit_kind: score, source: "molit#rows9,93"}
              - {name: "결격사유", limit: -20, limit_kind: penalty, source: "molit#rows10-11"}
          - band_key: "notice_1000"
            band_label: "추정가격 고시금액 이상 10억원 미만인 용역"
            total_limit: 100
            items:
              - {name: "당해 용역 수행능력", limit: 70, limit_kind: score, source: "molit#rows5-6"}
              - {name: "입찰가격", limit: 30, limit_kind: score, source: "molit#rows9,95"}
              - {name: "결격사유", limit: -20, limit_kind: penalty, source: "molit#rows10-11"}
          - band_key: "1000_3000"
            band_label: "추정가격 10억원 이상 30억원 미만인 용역"
            total_limit: 100
            items:
              - {name: "당해 용역 수행능력", limit: 80, limit_kind: score, source: "molit#rows5-6"}
              - {name: "입찰가격", limit: 20, limit_kind: score, source: "molit#rows9,97"}
              - {name: "결격사유", limit: -20, limit_kind: penalty, source: "molit#rows10-11"}
          - band_key: "over_3000"
            band_label: "추정가격 30억원 이상인 용역"
            total_limit: 100
            items:
              - {name: "당해 용역 수행능력", limit: 80, limit_kind: score, source: "molit#rows5-6"}
              - {name: "입찰가격", limit: 20, limit_kind: score, source: "molit#rows9,99"}
              - {name: "결격사유", limit: -20, limit_kind: penalty, source: "molit#rows10-11"}
        details:
          - group: "부표 · 고시금액 미만 용역 당해 용역수행능력 심사항목"
            source: "molit#rows16-48; molit_txt:130-147"
            note: "평점 = 30/100 × 평가점수 (소수점 셋째 자리에서 반올림). 참여기술자 50 + (유사용역수행실적 34 또는 경영상태 34) + 용역업무 중복정도 12 + 신용도 4 = 100"
            grades:
              - {item: "참여기술자(참여감리원) · 사업책임기술자", limit: 25, sub: "기술자등급 7 + 경력 8 + 용역실적 10", source: "molit#rows18-25"}
              - {item: "참여기술자(참여감리원) · 분야별 책임기술자", limit: 25, sub: "기술자등급 7 + 경력 8 + 용역실적 10", source: "molit#rows26-32"}
              - {item: "유사용역 수행실적 (5천만원 이상용역)", limit: 34, sub: "용역수행건수 17 + 용역수행금액 17", source: "molit#rows33-37"}
              - {item: "경영상태 (5천만원 미만용역)", limit: 34, sub: "자기자본비율 17 + 유동비율 17", source: "molit#rows38-42"}
              - {item: "용역업무 중복정도", limit: 12, source: "molit#rows43-45"}
              - {item: "신용도", limit: 4, sub: "입찰참가제한 2 + 기술자(감리원)업무정지 2", source: "molit#rows46-48"}
      - rule_id: "SERVC_INST_MOLIT_20180104_SUPERVISION"
        service_type: "감리용역"
        attachment: "별표 1"
        table_name: "적격심사항목 및 배점한도액"
        source: "molit#rows4-11; molit_txt:89,95,102"
        note: "별표 1 은 일반용역과 같은 표를 쓰고, 고시금액 이상 10억원 미만 구간의 입찰가격 평탄 점수만 감리 25점(일반 20점)이다."
        bands:
          - band_key: "notice_1000_supervision"
            band_label: "추정가격 고시금액 이상 10억원 미만인 감리용역"
            total_limit: 100
            items:
              - {name: "당해 용역 수행능력", limit: 70, limit_kind: score, source: "molit#rows5-6"}
              - {name: "입찰가격", limit: 30, limit_kind: score, source: "molit#rows9,95", note: "예정가격 90.5% 이상이면 25점(일반용역은 93% 이상 20점)"}
              - {name: "결격사유", limit: -20, limit_kind: penalty, source: "molit#rows10-11"}

  - institution_name: "국가유산청"
    standard: "매장유산 조사용역 적격심사 세부기준 (국가유산청고시 제2024-6호, 2024-05-17)"
    quant_table_status: confirmed
    note: >
      매장유산 조사용역 전용이다. 원문 별표 1~5 의 평탄 비율에 대응하는 입찰가격 점수를
      인쇄하지 않아 입찰가격 항목은 배점한도만 확정한다. 세부 평가기준은 별지 1-1~1-5 에 있다.
    rules:
      - rule_id: "SERVC_INST_KHS_20240517_BURIAL"
        service_type: "매장유산 조사용역"
        attachment: "별표 1~5"
        table_name: "매장문화재 조사용역 적격심사항목 및 배점기준"
        source: "khs_table:75-85; khs#rows0-15"
        bands:
          - band_key: "over_1000"
            band_label: "추정가격 10억원 이상"
            total_limit: 100
            items:
              - {name: "Ⅰ. 조사이행능력(전문성)", limit: 50, limit_kind: score, source: "khs#row1"}
              - {name: "Ⅱ. 경영상태", limit: 20, limit_kind: score, source: "khs#row5"}
              - {name: "Ⅲ. 입찰가격(경제성)", limit: 30, limit_kind: score, source: "khs#row6"}
              - {name: "Ⅳ. 신인도", limit: null, limit_kind: reputation, source: "khs#row8"}
              - {name: "Ⅴ. 결격사유", limit: -20, limit_kind: penalty, source: "khs#row14"}
          - band_key: "500_1000"
            band_label: "추정가격 10억원 미만 5억원 이상"
            total_limit: 100
            items:
              - {name: "Ⅰ. 조사이행능력(전문성)", limit: 50, limit_kind: score, source: "khs_table:78"}
              - {name: "Ⅱ. 경영상태", limit: 20, limit_kind: score, source: "khs_table:78"}
              - {name: "Ⅲ. 입찰가격(경제성)", limit: 30, limit_kind: score, source: "khs_table:78"}
              - {name: "Ⅳ. 신인도", limit: null, limit_kind: reputation, source: "khs_table:78"}
              - {name: "Ⅴ. 결격사유", limit: -20, limit_kind: penalty, source: "khs_table:78"}
          - band_key: "250_500"
            band_label: "추정가격 5억원 미만 2.5억원 이상"
            total_limit: 100
            items:
              - {name: "Ⅰ. 조사이행능력(전문성)", limit: 40, limit_kind: score, source: "khs_table:80"}
              - {name: "Ⅱ. 경영상태", limit: 20, limit_kind: score, source: "khs_table:80"}
              - {name: "Ⅲ. 입찰가격(경제성)", limit: 40, limit_kind: score, source: "khs_table:80"}
              - {name: "Ⅳ. 신인도", limit: null, limit_kind: reputation, source: "khs_table:80"}
              - {name: "Ⅴ. 결격사유", limit: -20, limit_kind: penalty, source: "khs_table:80"}
          - band_key: "100_250"
            band_label: "추정가격 2.5억원 미만 1억원 이상"
            total_limit: 100
            items:
              - {name: "Ⅰ. 조사이행능력(전문성)", limit: 35, limit_kind: score, source: "khs_table:82"}
              - {name: "Ⅱ. 경영상태", limit: 20, limit_kind: score, source: "khs_table:82"}
              - {name: "Ⅲ. 입찰가격(경제성)", limit: 45, limit_kind: score, source: "khs_table:82"}
              - {name: "Ⅳ. 신인도", limit: null, limit_kind: reputation, source: "khs_table:82"}
              - {name: "Ⅴ. 결격사유", limit: -20, limit_kind: penalty, source: "khs_table:82"}
          - band_key: "under_100"
            band_label: "추정가격 1억원 미만"
            total_limit: 100
            items:
              - {name: "Ⅰ. 조사이행능력(전문성)", limit: 30, limit_kind: score, source: "khs_table:84"}
              - {name: "Ⅱ. 경영상태", limit: 20, limit_kind: score, source: "khs_table:84"}
              - {name: "Ⅲ. 입찰가격(경제성)", limit: 50, limit_kind: score, source: "khs_table:84"}
              - {name: "Ⅳ. 신인도", limit: null, limit_kind: reputation, source: "khs_table:84"}
              - {name: "Ⅴ. 결격사유", limit: -20, limit_kind: penalty, source: "khs_table:84"}
        details:
          - group: "별지 1-1 · 조사이행능력 등급별 점수 (모든 추정가격 적용)"
            source: "khs_table:87"
            grades:
              - {item: "1. 연구조사실적 · 조사실적", grades: ["A 300% 이상 10(5)", "B 200% 이상 9(4)", "C 100% 이상 8(3)", "D 100% 미만 7(2)"], note: "괄호는 2.5억원 미만 구간"}
              - {item: "2. 연구조사능력 · 조사인력수", grades: ["책임조사원 2명 이상 1.5 / 2명 미만 0.5", "조사원 2명 이상 6 / 2명 미만 5", "준조사원 2명 이상 2.5 / 2명 미만 1.5"]}
              - {item: "3. 연구조사평가 · 발굴조사보고서 평균점수", grades: ["A 90점 이상 25(20)[15]", "B 88점 이상 24(19)[14]", "C 85점 이상 23(18)[13]", "D 85점 미만 22(17)[12]"], note: "[ ] 는 1억원 미만 구간"}
              - {item: "4. 연구조사기반 · 수장·보존처리시설 비율", grades: ["A 150% 이상 5", "B 120% 이상 4.7", "C 120% 미만 4.4"]}
          - group: "별지 1-3 · 경영상태(신용평가등급) 등급별 점수"
            source: "khs_table:114"
            grades:
              - {item: "기업신용평가등급", grades: ["A- 이상 20.0", "BBB+ 19.8", "BBB0 19.6", "BBB- 19.4", "BB+, BB0 19.2", "BB- 19.0", "B+, B0, B- 18.8", "CCC+ 이하 18.0"]}
          - group: "별지 1-4 · 신인도 항목별 점수"
            source: "khs_table:123-167"
            grades:
              - {item: "1. 용역전문성 (동일지역 동일공종 5건 이상 / 선행용역 수행)", grades: ["+1 / +1"]}
              - {item: "2. 업무정지(경고)처분", grades: ["업무정지 2회 이상 -2", "업무정지 1회 -1", "경고 1회 이상 -0.5"]}
              - {item: "3. 안전관리(산업재해율)", grades: ["3% 이상 -1", "1% 이상 3% 미만 -0.5"]}
              - {item: "4. 공동수급체 구성", grades: ["3개사 +1.0", "2개사 +0.5"]}
              - {item: "5. 여성고용", grades: ["+0.5 / +0.2"]}
              - {item: "6. 장애인고용", grades: ["+1.0 / +0.5"]}
          - group: "별지 1-5 · 결격사유"
            source: "khs_table:168-170"
            grades:
              - {item: "1. 이행위험 (계약보증증권 미제출)", grades: ["-20"]}
              - {item: "2. 부정당업자제재", grades: ["-20"]}

  - institution_name: "환경부"
    standard: "기술용역 적격심사 및 협상에 의한 낙찰자 결정기준 (기후에너지환경부훈령 제4호, 2025-11-11)"
    quant_table_status: confirmed
    note: >
      기술용역 기준이다. 별표 1 의 심사항목 배점한도는 국토교통부와 같은 구조이고 값도
      같다(당해용역수행능력 30/70/80/80, 입찰가격 70/30/20/20, 결격 -20). 고시금액 미만
