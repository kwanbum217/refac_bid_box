  khs_table: ".cache/inst_originals/task_ac5c1133322a/extracted_TABLE_국가유산청 매장문화재_조사용역_적격심사_세부기준(개정전문).txt"
  me: ".cache/inst_originals/task_889fe5b87a19/me/me_byl1_text.txt"
  me_body: ".cache/inst_originals/task_889fe5b87a19/me/me_techyongyeok_2025-11-11.txt"
  krc: ".cache/inst_originals/task_4103791c2123/user_files/한국농어촌공사 일반용역 적격심사 한국농어촌공사 세부기준(20260624).hwp"
  kogas_main: ".cache/inst_originals/task_a61c0e310be3/kogas/cur2026/kogas_cur2026_main.txt"
  kogas_byul9: ".cache/inst_originals/task_a61c0e310be3/kogas/cur2026/kogas_cur2026_byul9.txt"
  khnp: ".cache/inst_originals/task_4103791c2123/user_files/한국수력원자력 일반용역적격심사세부기준(11차)(20260619)_전문.hwp"
  kdhc: ".cache/inst_originals/task_4103791c2123/user_files/한국지역난방공사 260129_일반용역적격심사세부기준(개정전문)(2026.01.01).hwp"
