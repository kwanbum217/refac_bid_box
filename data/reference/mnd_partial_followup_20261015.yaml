note: >
  국방부 partial 후보(data/reference/institution_rules_candidates_b_20261014.yaml)의 우선순위 4번 후속 수집 결과다.
  기관 규칙 코드, 커버리지 원장, 기존 후보 YAML 은 읽기만 했고 고치지 않았다.
  기술용역 훈령(국방부훈령 제2987호)의 별표 1 평가기준표 네 구간 라벨과 미확정 계수 k 를 추가로 읽었고,
  일반용역 훈령(국방부훈령 제3176호) 전문을 국가법령정보센터 첨부에서 새로 확보해 별표 1 구간과 제9조 통과점수를 읽었다.
  여전히 읽지 못한 값은 pending 에 남겼다. 근거 없음은 blocked 로 적지 않는다.
  원문 파일은 .cache/inst_candidates/ 아래에만 두었고 커밋하지 않는다(.cache 는 gitignore 대상).
  source 의 파일:행 좌표는 그 파일을 scripts/extract_score_params.py 의 extract_document_text 로 읽었을 때의
  문서 순서 행 번호이거나, 바이너리 HWP 는 레코드 텍스트 문단 순서다.

conventions:
  score_formula: "P = B - k * |base_ratio/100 - bid_price/estimated_price| * 100"
  lower_inclusive: true
  upper_exclusive: true
  money_unit: "KRW"
  boundary_token: "고시금액은 국가계약법 제4조제1항에 따라 기획재정부장관이 고시한 금액을 뜻한다"
  confirmed_rule: >
    confirmed 는 훈령 원문이나 나라장터 첨부에서 직접 읽은 문장만 허용한다. 원문에서 구간 라벨과
    통과점수를 같은 문장이나 표에서 함께 확인하지 못한 행은 partial 로 둔다. 상업 게시판 계수는 전재하지 않는다.

