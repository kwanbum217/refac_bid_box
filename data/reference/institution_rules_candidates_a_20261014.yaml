note: >
  규칙 명단(data/reference/institution_rules_20261013.yaml)에 없는 국가계약 기관 7곳의 용역 적격심사 자체 세부기준 보유 여부를
  조사한 후보 명세다. 이 파일은 명단에 바로 반영하지 않으며, 기존 코드·명단·테스트는 이 작업에서 바꾸지 않았다.
  판정 규칙은 docs/analysis/servc_formula_collection_central_20261004.md 2절의 10개 규칙을 그대로 따랐다.
  원문 파일은 .cache/inst_candidates/ 아래에만 두었고 커밋하지 않는다.
conventions:
  score_formula: "P = B - k * |base_ratio/100 - bid_price/estimated_price| * 100"
  lwlt_formula: "base_ratio - (100 - pass_score) / k"
  lwlt_notation: "계산값을 소수 둘째 자리까지 버린 뒤 0.005 를 빼 .995 표기 관행을 따른다"
  lower_inclusive: true
  upper_exclusive: true
  money_unit: "KRW"
  recommendation_values:
    - add_to_registry
    - pps_standard_applies
    - partial
    - source_unavailable
    - not_qualification
