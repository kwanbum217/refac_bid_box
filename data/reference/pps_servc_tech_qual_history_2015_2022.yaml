  item: 구간1(추정가격 10억원 이상) 30억원 이상 하위 구간의 평탄 비율
  reason: 원문 평탄 문구가 '추정가격이 30억원 미만 10억원 이상인 용역' 으로만 인쇄되어 30억원 이상 구간에는 평탄 문구가 없다. flat_ratio 를 null 로 두었다(추정하지 않음).
- revision: 2016, 2021
  item: 시행 개정판 없음
  reason: 연혁 목록상 2015-11-19 다음 시행판은 2017-11-01, 2020-10-15 다음은 2022-11-01 이다. 2016년과 2021년에는 시행된 개정판이 없다.
- revision: 2022-11-01 이후
  item: 2022-11-01 시행판의 종료
  reason: 다음 시행판은 조달청지침 제6352호(시행 2025-09-01)라 이 판의 종료일을 2025-08-31 로 적었다. 2023~2025-08 구간은 이 명세(2015~2022 시행)에 담지 않는다.
- revision: 전 판
  item: 낙찰하한율 원문
  reason: 낙찰하한율은 고시 조문·별표에 인쇄되어 있지 않다. lwlt_rate 는 기준비율·평점계수·통과점수로 역산한 파생값이다.
