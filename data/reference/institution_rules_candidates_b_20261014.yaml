    note: >
      산림청 및 소속기관이 발주하는 산림사업에 적용하는 자체 예규다(제1조·제2조). 나라장터 Servc 범주로 올라오는
      입목처분 위탁조사 용역 등이 이 기준을 첨부한다. 종합평점 통과점수는 제5조① 이 95점으로 규정하며 사업규모별로
      달라지지 않는다. 별표 1~5 각각에서 입찰가격 평점산식의 B·k·기준비율과 평탄(이상인 경우의 인쇄 점수)을 모두
      확인했고, 평탄 대입값이 인쇄 점수와 정확히 일치한다(아래 band 검산). 다만 이 기준은 산림사업 전용이며
      일반용역(청소·경비 등) 자체 산식은 이 예규 범위에 없다. 제8조는 이 기준에 없는 사항은 기획재정부 계약예규와
      조달청 집행기준을 적용한다고 정한다.
