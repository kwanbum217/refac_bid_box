note: >
  이 파일은 후보 명세다. 기존 명단(data/reference/institution_rules_20261013.yaml)과 코드는 변경하지 않았다.
  기관 항목 스키마는 기존 명단의 institutions 항목을 그대로 쓰고, 판정용 필드(recommendation,
  own_standard_exists, announcements_last_year, attempted_paths)를 추가했다.
  status 는 confirmed/partial/unresolved 중 하나이고, band 의 status 와는 별개로 기관 단위 판정도다.
  recommendation 은 add_to_registry / pps_standard_applies / partial / source_unavailable / not_qualification 중 하나다.
  announcements_last_year 는 코디네이터 집계(2026-10-14, 최근 1년 2025-10-14 이후 Servc 낙030001) 값이다.
  원문 파일은 .cache/inst_candidates/ 아래에만 두었고 커밋하지 않는다(.cache 는 gitignore 대상).
  source 의 파일:행 좌표는 그 파일을 scripts/extract_score_params.py 의 extract_document_text 로 읽었을 때의
  문서 순서 행 번호이거나, PDF 는 추출 마크다운 행 번호다.

conventions:
  score_formula: "P = B - k * |base_ratio/100 - bid_price/estimated_price| * 100"
  lwlt_formula: "base_ratio - (100 - pass_score) / k"
  lwlt_notation: "계산값을 소수 둘째 자리까지 버린 뒤 0.005 를 빼 .995 표기 관행을 따른다 (예: 85.500 -> 85.495)"
  lower_inclusive: true
  upper_exclusive: true
  money_unit: "KRW"
  boundary_token: "고시금액은 국가계약법 시행령에 따른 연도별 고시금액을 뜻한다"

