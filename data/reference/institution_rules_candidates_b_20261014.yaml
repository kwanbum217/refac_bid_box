    standard: "기술용역 적격심사기준에 관한 훈령 (국방부훈령 제2987호, 2024-12-03 일부개정·시행). 일반용역은 별도 '일반용역 적격심사기준에 관한 훈령'(국방부훈령 제3176호, 2026-06-22)을 둔다(원문 미확보)"
    effective_date: "2024-12-03"
    service_types: ["기술용역 (엔지니어링·건설기술·건축서비스·건축사·전기·정보통신·소방 등 법령에 따른 기술용역)"]
    note: >
      국방부 본부·소속기관·국직부대·합참·각군이 집행하는 기술용역입찰에 적용하는 자체 훈령이다(제1조·제2조).
      나라장터 국방부 공고는 '국방부 기술용역적격심사기준에 관한 훈령'을 적용한다고 명시한다(파일 근거 아래).
      별표 1 은 입찰가격 배점한도가 30·50·70·90 인 평가기준표 4개로 나뉘고, 기준비율은 모두 88/100 이다.
      추정가격 30억원 이상은 85점, 30억원 미만 10억원 이상은 90점, 10억원 미만은 95점이 적격통과점수다(제9조).
      배점한도 30 인 기준표는 산식에 계수 자리가 인쇄되지 않고 평탄 문장도 없어 규칙 5에 따라 k 를 확정하지
      않았다(방위사업청 별표 1 과 같은 형태). 배점한도 90 인 기준표는 별표 1 에서 산식 행을 읽지 못해 k 미확인이다.
      구간 라벨(추정가격 경계)은 훈령 별표 1 본문에서 직접 인쇄를 확인하지 못했고, 제9조 통과점수 경계와
      조달청 기술용역 기준 구조, 그리고 다른 국방부 공고의 '추정가격 5억원 미만 고시금액 이상인 용역' 적용 문구로
      대응시킨 것이다. 그래서 네 구간 모두 status: partial 로 두어 확정 구간으로 세지 않는다. HWP 수식 개체
      추출 한계로 표기가 일부 유실되었고, 전사 훈령을 국가법령정보센터에서 본문 텍스트로 확보하지 못했다.
