  - path: "KAC 한국공항공사 공식 홈페이지 규정 게시판 (열린경영 > 입찰정보 > 규정 및 계약조건, MENU_ID=920)"
    result: >
      성공. 목록 API(bbsViewList.do)를 제목 검색어 '적격심사'로 호출해 13건을 확인했고, 용역 유형 게시물
      네 건(일반용역 26.8.14 시행·26.3.2 시행, 기술용역 26.8.14 시행·26.3.2 시행)과 물품·공사 게시물을 확인했다.
      최신 두 건의 첨부 '전문' HWP 를 내려받아 전사 규정 원문을 읽었다.
  - path: "전사 규정 원문 판독 (cache gen_general_260814.hwp, tech_general_260814.hwp)"
    result: >
      성공. scripts/extract_score_params.py 의 extract_document_text 로 표 행과 평문을 얻고, _ole_streams /
      _hwp_records / _hwp_record_text 로 문단 텍스트를 따로 얻었다. 평문 통짜 UTF-16LE 디코딩은 정렬 오차로
      일부가 깨졌고, 레코드 단위 문단 텍스트에서 제10조·제4조 문장과 별표 산식 표를 회수했다.
  - path: "국가법령정보센터 행정규칙 (한국공항공사)"
    result: >
      시도. 공사는 공기업이라 적격심사 세부기준이 행정규칙으로 등록되어 있지 않다. 전사 규정 게시판에서
      원문을 확보했으므로 추가 조회는 하지 않았다.
  - path: "알리오 공공기관 경영정보 공개시스템 내부규정"
    result: >
      시도. /occasional/findRuleList.json 을 기관명·제목으로 조회해 한국공항공사 내부규정 71건을 확인했으나
      적격심사 세부기준은 그 목록에 없다(정관·인사규정·공사감독규정 등). 공사 홈페이지 게시판이 정본이다.
  - path: "나라장터 공고 첨부의 낙찰자 결정 조항"
    result: >
      이번 회차에 개별 공고를 새로 내려받지 않았다. 직전 회차가 개별 공고 첨부 7건에서 통과점수 0건을 확인했고,
      전사 규정 원문에서 통과점수를 확보했으므로 개별 공고 재판독은 범위에서 제외했다.

failed_paths:
  - path: "KAC 공식 홈페이지 게시판에서 시설분야용역 명의 게시물 검색"
    result: >
      제목 검색어 '시설분야용역' 결과 0건. 원문 제5조 제1항 제2호가 시설분야용역 평가기준을 일반용역
      적격심사세부기준 [별표 2]로 지정하므로 별도 전사 규정이 존재하지 않는 것으로 확인했다.
  - path: "상업·교육 게시판 게시물 계수 전재"
    result: >
      사용하지 않음. 검색 결과에 일반용역·시설공사 세부기준 전문을 게시한 상업·교육 게시판 글이 다수
      확인되었으나 규칙에 따라 계수와 통과점수를 전재하지 않았다. 이 파일의 모든 값은 공사 공식 게시판
      첨부 원문에서 읽었다.
  - path: "일반용역 세부기준 부칙 문단 추출"
    result: >
      실패. 레코드 텍스트에서 '부칙' 문단을 찾지 못했다. 시행일은 게시물 제목과 첨부 파일명 '(260814시행)' 및
      개정 이력의 '2026. 8. 5 지침 제792호' 로 확인했다. 기술용역 세부기준은 부칙<26. 8. 5.> 문단을 읽었다.
  - path: "기술용역 세부기준 평문 통짜 디코딩"
    result: >
      실패. Section0 스트림을 UTF-16LE 로 통째로 디코딩하면 레코드 크기가 어긋나 본문 대부분이 깨졌다.
      _hwp_records 로 레코드를 나눠 읽는 방식으로 대체해 제4조와 평가기준표 네 구간을 정상 판독했다.

