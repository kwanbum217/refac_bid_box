objective: >
  한국공항공사 전사 적격심사 규정 원문과 종합평점 통과점수를 추가 수집해 새 YAML 과
  분석 문서에 기록한다. 기관 규칙 코드와 커버리지 원장은 고치지 않는다.

note: >
  이번 회차는 재조사가 아니라 신규 경로 개척이다. 직전 회차(data/reference/kac_partial_followup_20261015.yaml)는
  나라장터 개별 공고 첨부 7건만 읽고 전사 규정 원문과 통과점수를 확보하지 못해 bands 를 비워 두었다.
  이번 회차는 공사 공식 홈페이지의 규정 게시판(열린경영 > 입찰정보 > 규정 및 계약조건)에서 전사 규정 원문
  두 건을 직접 내려받아 읽었고, 그 결과 종합평점 통과점수와 별표 구간표를 원문 문장으로 확정했다.
  직전 회차의 두 파일(data/reference/kac_partial_followup_20261015.yaml, docs/analysis/kac_partial_followup_20261015.md)은
  덮어쓰지 않았다. 기관 규칙 코드(src/app), data/reference/rule_coverage_ledger.yaml, 기존 후보 YAML 도 고치지 않았다.
  개별 공고 첨부에서 읽은 관측값은 여기에 승격하지 않는다. 이 파일의 bands 는 전사 규정 원문에서 읽은 값만 담는다.
  원문 파일은 .cache/inst_candidates/kac/ 아래에만 두었고 커밋하지 않는다(.cache 는 gitignore 대상).
  source 의 좌표는 scripts/extract_score_params.py 의 _ole_streams / _hwp_records / _hwp_record_text 로
  읽었을 때의 레코드 텍스트 문단 순서 또는 표 행 순서다.

conventions:
  score_formula: "P = B - k * |base_ratio/100 - bid_price/estimated_price| * 100"
  lower_inclusive: true
  upper_exclusive: true
  money_unit: "KRW"
  boundary_token: "고시금액은 국가계약법 제4조에 따라 기획재정부장관이 고시한 금액을 뜻한다"
  quote_scope: >
    quote 는 scripts/extract_score_params.py 로 읽은 전사 규정 원문 문장이며 요약하지 않는다.
    표 셀 조판 순서 때문에 원문 한 문장이 여러 조각으로 나뉜 경우는 조각을 그대로 잇고 그 사실을 밝힌다.
  confirmed_rule: >
    confirmed 는 전사 규정 원문이나 나라장터 첨부에서 직접 읽은 문장만 허용한다. 전사 규정 원문에서
    구간 라벨과 통과점수를 함께 읽은 행만 confirmed 로 두고, 통과점수를 별도 조문에서 읽어 라벨과
    같은 표에서 결합하지 못한 행은 partial 로 둔다. 상업·교육 게시판의 계수는 전재하지 않는다.

