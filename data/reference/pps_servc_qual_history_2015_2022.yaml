schema: PPS_SERVC_QUAL_HISTORY_V1
version: 1.0.0
created_at: '2026-10-13'
source_task: task_c4b489e36343
scope: PPS_SERVC_QUAL_HISTORY
title: 조달청 일반용역 적격심사 세부기준 입찰가격 평점 별표 개정판 명세 (2015~2022 시행)
conventions:
  score_formula: P = B - k * |base_ratio/100 - bid_price/estimated_price| * 100
  lwlt_formula: base_ratio - (100 - pass_score) / k
  lwlt_notation: '계산값을 소수 둘째 자리까지 버린 뒤 0.005 를 뺀 .995 표기 관행. 예: 88.000 -> 87.995, 84.250 -> 84.245'
  lwlt_basis: 낙찰하한율은 고시 조문·별표에 인쇄되어 있지 않다. 이 명세의 lwlt_rate 는 위 lwlt_formula 로 역산한 파생값이다.
  lower_inclusive: true
  upper_exclusive: true
  boundary_token: 고시금액(용역)은 국가계약법 시행령에 따른 연도별 고시금액이다. 추정가격 구간 경계는 문자열 '고시금액' 으로 적는다.
  money_unit: KRW
  band_axes: 별표에 따라 배점한도 B 의 추정가격 구간 경계와 평점산식 k 의 추정가격 구간 경계가 다르다. price_lower/price_upper 는 B 구간, formula_lower/formula_upper 는 평점산식 구간이다.
source:
  archive: 국가법령정보센터 행정규칙 연혁
  archive_url: https://www.law.go.kr/admRulLsInfoP.do?admRulId=33121&efYd=0
  admin_rule_id: '33121'
  retrieved_at: '2026-10-13'
  read_method: scripts/extract_score_params.py 의 HWP 5.x(OLE) 판독기를 재사용해 BodyText/Section0 레코드에서 표·수식 개체를 읽었다. 원문 파일은 .cache/pps_history/ 에만 두고 커밋하지 않는다.
