- revision: 2015-41
  item: 별표 3의2·5의2 (정보통신·육상운송 중소기업자간 경쟁제품 대상)
  reason: 본문 제10조는 대상 용역에 88점을 적지만, 이 판의 행정규칙 별표 첨부에 대상 별표 파일이 없다. 대상 배점한도·평점계수는 미수집.
- revision: 2020-10, 2020-30
  item: 보험용역 별표
  reason: 이 두 판의 별표 첨부는 별표 1~5의2 와 별표 6(신용평가등급)·7(신인도)로, 보험용역 별표가 없다. 보험용역 별표는 제2021-2호부터 첨부에 나타난다.
- revision: 2016-48
  item: 시행일 중복
  reason: 제2016-48호(발령 2016-04-08)와 제2016-51호(발령 2016-04-26)가 시행일을 2016-05-01 로 같이 둔다. 별표 9개 중 5개는 문서 텍스트가 동일하고 4개는 결격사유·신인도 문구만 다르며 가격 파라미터는 같다. 시행일 전 제2016-51호로 대체된 것으로 본다.
- revision: 전 판
  item: 낙찰하한율 원문
  reason: 낙찰하한율은 고시 조문·별표에 인쇄되어 있지 않다. lwlt_rate 는 기준비율·평점계수·통과점수로 역산한 파생값이다.
- revision: 2015-41 직전
  item: 제2014-56호 (시행 2014-10-01)
  reason: 2015-01-01~2015-04-30 구간을 담당하나 시행일이 2014년이라 이 명세(2015~2022 시행) 범위 밖이다.
