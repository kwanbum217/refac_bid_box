  pass_score_evidence: 종합평점이 85점(다만, 정보통신용역, 육상운송용역의 중소기업자간 경쟁제품은 88점)이상이면 낙찰자로 결정한다
  attachments:
  - attachment: 별표 1
    title: 학술연구용역적격심사항목및배점한도
    service_type: 학술연구용역
    fl_seq: '19967657'
    evidence:
      header_row: 1
      b_row: 6
      band_labels:
      - 추정가격 2억원이상
      - 추정가격 2억원미만
      B_row:
      - '40'
      - '70'
      formula:
      - 평점(점) = 배점한도 ­ 2 × ( 88 ­ 입찰가격 )× 100
      exceptions:
      - (다만, 입찰가격이 예정가격 이하로서 예정가격의 95.5%이상인 경우에는 입찰가격이 예정가격의 95.5%인 경우의 점수로 평가) - ｜｜는 절대값 표시임. - 입찰가격을 예정가격으로 나눈 결과 소숫점 이하의 숫자가 있는 경우에는 소숫점 다섯째자리에서 반올림함. - 최저평점은 2점으로 함. 이행실적 평가는 [별표 1-1]의 평가기준에 의하여 평가한다. 경영상태 평가는 [별표 6]의 평가기준에 의하여 평가한다. 신인도 평가는 [별표 7]의 평가기준에 의하여 평가한다.
