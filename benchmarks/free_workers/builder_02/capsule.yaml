schema: ORCA_TASK_CAPSULE_V2
version: "2.1.0"
mode: worker
run_id: "__RUN_ID__"
task_id: "__TASK_ID__"
role: "builder"

# 사전 등록 항목입니다. 실행 전에 정했고 결과를 보고 바꾸지 않습니다.
benchmark:
  id: "free_workers/builder_02"
  timeout_sec: 720
  repetitions_per_stack: 3
  scorer: "benchmarks/free_workers/builder_02/scoring_02.py"
  scorer_frozen_before_run: true

objective: >
  scripts/audit_model_inventory.py 에 --json 출력 옵션을 추가합니다. --json 을
  주면 사람이 읽는 줄 대신 기계 판독용 JSON 객체 하나만 stdout 에 출력합니다.
  종료 코드 계약은 그대로 유지합니다. 테스트를 추가하고 작업 브랜치에
  커밋합니다.

why_now: >
  이 도구를 CI 에서 돌리려면 출력을 파싱해야 하는데 현재는 사람이 읽는 한국어
  줄뿐입니다. 문자열을 파싱하면 표시 문구를 바꿀 때 조용히 깨집니다.

ground_truth:
  - fact: "audit() 은 (extinct_count, lines) 튜플을 반환하고 main() 은 종료 코드 0/1/2 를 낸다. 0 은 전부 확인 또는 의심, 1 은 3회 연속 이탈 확인, 2 는 도구 오류다."
    evidence: "scripts/audit_model_inventory.py"
    recheck: false
  - fact: "관측 결과는 present / absent / unknown 세 값이며 unknown 은 연속 absent 카운터를 올리지도 초기화하지도 않는다. 이 불변식은 반드시 보존해야 한다."
    evidence: "scripts/audit_model_inventory.py"
    recheck: false
  - fact: "기존 테스트는 tests/test_audit_model_inventory.py 에 있고 전부 통과 상태다. 하나도 깨뜨리지 말 것."
    evidence: "tests/test_audit_model_inventory.py"
    recheck: false
  - fact: "이 저장소는 uv 를 쓴다. macOS 의 python3 는 Xcode 3.9 이므로 파이썬 실행은 반드시 'uv run python' 으로 한다."
    evidence: "docs/ops/orca_do_not_repeat.md"
    recheck: false

allowed_read_files:
  - "benchmarks/free_workers/builder_02/capsule.yaml"
  - "scripts/audit_model_inventory.py"
  - "tests/test_audit_model_inventory.py"
  - "scripts/orca_model_router.py"

allowed_write_files:
  - "scripts/audit_model_inventory.py"
  - "tests/test_audit_model_inventory.py"

search_scope:
  mode: deny_by_default
  allowed_globs: []

forbidden:
  - "README.md, AGENTS.md, SKILLS.md, docs/ 재독 금지"
  - "scripts/orca_model_router.py 수정 금지 (읽기만 허용)"
  - "기존 테스트 삭제 또는 assert 약화 금지"
  - "실제 CLI(opencode, kimi, agy) 호출 테스트 금지. monkeypatch 로 대체할 것"
  - "새 외부 패키지 추가 금지. 표준 라이브러리만 사용"
  - "main 브랜치 직접 수정 및 커밋 금지"
  - "Pull Request 생성 금지"
  - "이모지 사용 금지"

shared_resources:
  - resource: docker
    ownership: none

required_change:
  - "--json 플래그를 추가합니다."
  - "--json 지정 시 stdout 에 JSON 객체 정확히 하나만 출력합니다. 사람이 읽는 줄이나 안내문을 함께 찍지 않습니다."
  - "JSON 최상위에 정수 필드 extinct 를 넣습니다. 3회 연속 이탈로 소멸 판정된 항목 수입니다."
  - "JSON 최상위에 객체 필드 pools 를 넣습니다. 키는 pool_name 이고 값은 객체입니다."
  - "pools 의 각 값에 문자열 필드 status 를 넣습니다. 값은 present, absent, unknown, skipped 중 하나입니다. 배정 대상이 아닌 항목(suitable_for 가 빈 목록)은 skipped 입니다."
  - "pools 의 각 값에 정수 필드 streak 를 넣습니다. 그 시점의 연속 absent 횟수입니다. present 나 skipped 이면 0 입니다."
  - "--json 이 없을 때의 출력과 종료 코드는 지금과 동일하게 유지합니다."
  - "--json 지정 시에도 종료 코드는 동일한 규칙을 따릅니다."
  - "--json 과 --quiet 을 함께 주면 --json 이 이깁니다. JSON 만 출력합니다."

acceptance:
  - "--json 출력이 json.loads 로 파싱되고 extinct 와 pools 키를 갖습니다."
  - "absent 3회 연속에서 --json 출력의 extinct 가 1 이상이고 종료 코드가 1 입니다."
  - "absent 2회 연속에서 extinct 가 0 이고 종료 코드가 0 이며 해당 pool 의 streak 가 2 입니다."
  - "unknown 관측이 streak 를 보존합니다."
  - "기존 테스트가 전부 통과합니다."
  - "uv run pytest tests/ -q 전량 통과"
  - "작업 브랜치에 커밋이 1건 이상 있습니다."

verification_commands:
  - "uv run pytest tests/test_audit_model_inventory.py -q"
  - "uv run pytest tests/ -q"

review_checklist:
  - id: "json_only"
    question: "--json 지정 시 stdout 에 JSON 외의 텍스트가 섞여 나오는가?"
    defect_when: "yes"
  - id: "exit_code_changed"
    question: "--json 이 없을 때의 종료 코드 규칙이 바뀌었는가?"
    defect_when: "yes"
  - id: "unknown_invariant"
    question: "unknown 관측이 streak 를 증가시키거나 초기화하는가?"
    defect_when: "yes"
  - id: "existing_tests_weakened"
    question: "기존 테스트가 삭제되거나 assert 가 약화되었는가?"
    defect_when: "yes"

artifact_paths: []

escalate_when:
  - "allowed_write_files 범위를 벗어난 수정이 필요한 경우"
  - "ground_truth 와 실제 코드가 충돌하는 경우"
  - "새 외부 패키지가 필요한 경우"

return_contract: ORCA_WORKER_DONE_V2
