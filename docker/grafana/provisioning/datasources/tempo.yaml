# Grafana Tempo 데이터소스 provision
# Collector 가 tail sampling 뒤 Tempo 로 보낸 추적을 조회합니다. 3200 은 Tempo HTTP API 포트입니다.
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      serviceMap:
        datasourceUid: prometheus
