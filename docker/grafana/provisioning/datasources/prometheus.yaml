# Grafana Prometheus 데이터소스 provision (관측성 2단계)
# HTTP/DB 지연 대시보드는 docker/grafana/dashboards/http_db_latency.json 입니다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
