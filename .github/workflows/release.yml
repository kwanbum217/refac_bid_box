name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: '초안(draft) 릴리스 생성 여부'
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: 수동 릴리스
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Check release readiness
        id: readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          python scripts/check_release_readiness.py \
            --commit "$(git rev-parse HEAD)" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate grouped release notes
        run: |
          python scripts/check_release_readiness.py \
            --tag "${{ steps.readiness.outputs.tag }}" \
            --notes-output "$RUNNER_TEMP/release-notes.md"

      - name: Build release application image
        id: build-image
        env:
          RELEASE_TAG: ${{ steps.readiness.outputs.tag }}
        run: |
          docker buildx build --load -t "refac-bid-box:${RELEASE_TAG}" .

      - name: Scan container image
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: refac-bid-box:${{ steps.readiness.outputs.tag }}
          format: json
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          output: trivy-results.json

      - name: Filter Trivy results against allowlist
        run: |
          uv run python scripts/filter_trivy_results.py \
            --input trivy-results.json \
            --allowlist .github/vulnerability-allowlist.yml

      - name: Generate application SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: refac-bid-box:${{ steps.readiness.outputs.tag }}
          artifact-name: refac-bid-box-sbom.spdx.json
          output-file: refac-bid-box-sbom.spdx.json
          format: spdx-json

      - name: Record image digest and update release notes
        env:
          RELEASE_TAG: ${{ steps.readiness.outputs.tag }}
        run: |
          IMAGE_ID=$(docker inspect --format='{{.Id}}' "refac-bid-box:${RELEASE_TAG}")
          {
            echo "image: refac-bid-box:${RELEASE_TAG}"
            echo "image_id: ${IMAGE_ID}"
            echo "digest: ${IMAGE_ID}"
          } > image-digest.txt
          echo "" >> "$RUNNER_TEMP/release-notes.md"
          echo "Image Digest: ${IMAGE_ID}" >> "$RUNNER_TEMP/release-notes.md"

      - name: Create and push release tag
        if: ${{ !inputs.draft }}
        env:
          RELEASE_TAG: ${{ steps.readiness.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$(git rev-parse HEAD)"
          git push origin "$RELEASE_TAG"

      - name: Create draft GitHub release
        if: ${{ inputs.draft }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.readiness.outputs.tag }}
          IS_PRERELEASE: ${{ steps.readiness.outputs.prerelease }}
        run: |
          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi
          gh release create "$RELEASE_TAG" \
            --draft \
            ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"} \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            refac-bid-box-sbom.spdx.json \
            image-digest.txt

      - name: Create public GitHub release
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.readiness.outputs.tag }}
          IS_PRERELEASE: ${{ steps.readiness.outputs.prerelease }}
        run: |
          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"} \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            refac-bid-box-sbom.spdx.json \
            image-digest.txt
