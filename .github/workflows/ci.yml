name: CI

on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Bandit Security Scan
        run: uv run bandit -c pyproject.toml -r src/ scripts/

      - name: Validate Multi-Agent Rules Consistency
        run: python3 scripts/validate_agent_rules.py --quiet

  cross-platform-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install macOS OpenMP runtime
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install libomp

      - name: Run pytest (SQLite in-memory)
        run: uv run pytest -q
