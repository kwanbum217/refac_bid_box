name: CI

on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 얕은 클론에서는 CURRENT_STATE 의 source_commit 을 조회하지 못해
          # 신선도 검사가 항상 "미검증" 으로 내려앉습니다. 전체 이력을 받아야
          # CI 가 실제로 검사합니다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Dockerfile 의 python:3.11-slim 과 맞춥니다. 어긋나면 CI 가 배포 런타임을
          # 검증하지 않게 됩니다.
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Bandit Security Scan
        run: uv run bandit -c pyproject.toml -r src/ scripts/

      # 이 러너는 3.11 이지만 mypy 는 pyproject 의 python_version 3.12 로
      # 해석합니다. 설치된 numpy 스텁이 3.12 전용 구문을 써서, 3.11 로
      # 해석하면 스텁 파싱에서 멈춰 우리 코드를 한 줄도 검사하지 못합니다.
      - name: Run mypy Type Check
        run: uv run mypy src/

      - name: Validate Multi-Agent Rules Consistency
        run: python3 scripts/validate_agent_rules.py --quiet

      # 워크플로우 파일은 pytest 가 검증하지 않습니다. Orca 게이트 3 의
      # workflow_lint 능력도 이 명령으로 덮습니다.
      - name: Lint GitHub Actions Workflows
        run: uv run actionlint

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  cross-platform-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 배포 런타임은 python:3.11-slim(Linux)입니다. ubuntu 를 빼면 실제
        # 운영 플랫폼에서 backend 테스트가 한 번도 돌지 않습니다.
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install macOS OpenMP runtime
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install libomp

      # 데이터 자산(모델 가중치, chroma_db)은 저장소에 없으므로 G1 검증은 로컬 전용입니다.
      - name: Run pytest (SQLite in-memory)
        run: uv run pytest -q -m "not data_assets"

  docker-build:
    name: Docker 이미지 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 운영 이미지가 uv.lock 기준으로 재현 가능하게 빌드되는지 확인합니다.
      # 이 잡이 없으면 Dockerfile 의 의존성 해석 오류를 배포 시점에야 알게 됩니다.
      - name: Build image
        run: docker build -t refac-bid-box:ci .

      # 설정은 SECRET_KEY 를 필수로 요구합니다(운영 fail-closed). 스모크용
      # 일회성 값을 주입할 뿐 실제 비밀은 CI 에 두지 않습니다.
      - name: Smoke check (앱 임포트)
        run: |
          docker run --rm -e SECRET_KEY=ci-smoke-placeholder-value-not-a-real-secret-0123456789 \
            refac-bid-box:ci python3 -c "import src.app.main"
