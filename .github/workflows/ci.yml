name: CI

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  supply-chain:
    name: 공급망 보안 검증
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # 공급망 스캔은 모두 차단 모드다. CRITICAL 과 HIGH 가 검출되면 CI 가 붉어진다.
      # || true 나 exit-code 0 으로 실패를 삼키지 않는다.
      # 사유와 만료가 박힌 예외만 .github/vulnerability-allowlist.yml 에서 통과시킨다.
      # 예외 목록이 게이트를 뚫는 유일한 통로이므로 그 목록 자체를 먼저 검사합니다.
      # 사유나 만료가 없거나 만료일이 지난 항목이 있으면 스캔 전에 실패합니다.
      - name: Validate vulnerability allowlist
        run: uv run python scripts/check_vulnerability_allowlist.py

      - name: Scan Python dependencies
        run: |
          uv export --frozen --format requirements.txt --no-emit-project -o /tmp/requirements.txt
          # allowlist 의 python 식별자 항목에서 --ignore-vuln 인자를 만든다. 항목이
          # 비어 있으면 IGNORE_ARGS 가 빈 문자열이 되어 pip-audit 가 그대로 실패한다.
          IGNORE_ARGS=$(python3 -c "import yaml
          data = yaml.safe_load(open('.github/vulnerability-allowlist.yml')) or {}
          print(' '.join('--ignore-vuln ' + e['id'] for e in data.get('python', [])))")
          # pip-audit 에는 --strict 플래그가 없으며 -r 과 함께 전달되면 위치 인자(project_path)로
          # 오인되어 상호 배타 에러로 비정상 종료합니다. 엄격 검사는 $IGNORE_ARGS 로 통제합니다.
          uvx --from pip-audit pip-audit -r /tmp/requirements.txt $IGNORE_ARGS

      - name: Scan JavaScript dependencies
        working-directory: frontend
        # npm audit 은 HIGH 이상 발견 시 비정상 종료한다. allowlist 의 npm 패키지에
        # 매칭되지 않는 HIGH/CRITICAL 취약점이 남아 있으면 그대로 실패한다.
        run: |
          set +e
          OUTPUT=$(npm audit --audit-level=high --json 2>/dev/null)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          fi
          echo "$OUTPUT" | python3 -c "import sys, json, yaml
          audit = json.loads(sys.stdin.read())
          # working-directory 가 frontend 이므로 상위 디렉터리의 allowlist 파일을 참조합니다.
          data = yaml.safe_load(open('../.github/vulnerability-allowlist.yml')) or {}
          allowed = {e['package'] for e in data.get('npm', [])}
          remaining = [(n, v.get('severity')) for n, v in audit.get('vulnerabilities', {}).items() if v.get('severity') in ('high','critical') and n not in allowed]
          if remaining:
              print('npm audit failed; HIGH/CRITICAL not in allowlist:', file=sys.stderr)
              [print(f'  - {n} ({s})', file=sys.stderr) for n, s in remaining]
              sys.exit(1)
          print('npm audit: all HIGH/CRITICAL vulnerabilities are in allowlist')"

      - name: Build application image
        run: docker build --pull=false -t refac-bid-box:ci .

      # Trivy 는 CRITICAL 과 HIGH 에서 비정상 종료한다. ignore-unfixed 는 유지한다.
      # 상류에 고칠 방법이 없는 항목은 후처리 step 에서 allowlist 와 대조해 통과시킨다.
      - name: Scan container image
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: refac-bid-box:ci
          format: json
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          output: trivy-results.json

      - name: Filter Trivy results against allowlist
        if: always()
        run: |
          # Trivy 가 정상 종료(0)이면 아무 취약점이 없다는 뜻이므로 그대로 통과한다.
          if [ "${{ steps.trivy-scan.outcome }}" = "success" ]; then
            exit 0
          fi
          RESULT_PATH=${TRIVY_OUTPUT:-trivy-results.json}
          if [ ! -f "$RESULT_PATH" ]; then
            echo "Trivy failed but result file not found: $RESULT_PATH" >&2
            exit 1
          fi
          python3 -c "import sys, json, yaml
          data = json.load(open('$RESULT_PATH'))
          allow = yaml.safe_load(open('.github/vulnerability-allowlist.yml')) or {}
          allowed_ids = {e['id'] for e in allow.get('trivy', [])}
          remaining = [(v.get('VulnerabilityID'), v.get('PkgName'), v.get('Severity')) for r in data.get('Results', []) for v in (r.get('Vulnerabilities') or []) if v.get('Severity') in ('CRITICAL','HIGH') and v.get('VulnerabilityID') not in allowed_ids]
          if remaining:
              print('Trivy failed; CRITICAL/HIGH not in allowlist:', file=sys.stderr)
              [print(f'  - {vid} {pkg} {sev}', file=sys.stderr) for vid, pkg, sev in remaining]
              sys.exit(1)
          print('Trivy: all CRITICAL/HIGH vulnerabilities are in allowlist')"
        env:
          TRIVY_OUTPUT: trivy-results.json

      - name: Generate application SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: refac-bid-box:ci
          artifact-name: refac-bid-box-sbom.spdx.json
          output-file: refac-bid-box-sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-sbom
          path: refac-bid-box-sbom.spdx.json
          if-no-files-found: error

  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 얕은 클론에서는 CURRENT_STATE 의 source_commit 을 조회하지 못해
          # 신선도 검사가 항상 "미검증" 으로 내려앉습니다. 전체 이력을 받아야
          # CI 가 실제로 검사합니다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Dockerfile 의 python:3.11-slim 과 맞춥니다. 어긋나면 CI 가 배포 런타임을
          # 검증하지 않게 됩니다.
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Bandit Security Scan
        run: uv run bandit -c pyproject.toml -r src/ scripts/

      # 이 러너는 3.11 이지만 mypy 는 pyproject 의 python_version 3.12 로
      # 해석합니다. 설치된 numpy 스텁이 3.12 전용 구문을 써서, 3.11 로
      # 해석하면 스텁 파싱에서 멈춰 우리 코드를 한 줄도 검사하지 못합니다.
      - name: Run mypy Type Check
        run: uv run mypy src/

      - name: Validate Multi-Agent Rules Consistency
        run: python3 scripts/validate_agent_rules.py --quiet

      # 감사 증거 및 문서 링크의 정합성을 검증합니다 (외부 URL 은 네트워크 불안정 방지를 위해 제외).
      - name: Validate Markdown Doc Links
        run: python3 scripts/validate_doc_links.py --quiet

      # 워크플로우 파일은 pytest 가 검증하지 않습니다. Orca 게이트 3 의
      # workflow_lint 능력도 이 명령으로 덮습니다.
      - name: Lint GitHub Actions Workflows
        run: uv run actionlint

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # 커밋된 tailwind.css 가 tailwind.config.js 와 입력 CSS 로부터 정확히
      # 재생성되는지 확인합니다. 생성물 드리프트를 차단합니다.
      - name: Install Tailwind Toolchain
        run: npm ci

      - name: Verify Tailwind CSS Reproducibility
        run: |
          npm run build:css
          git diff --exit-code -- src/app/static/css/tailwind.css

  cross-platform-test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 배포 런타임은 python:3.11-slim(Linux)입니다. ubuntu 를 빼면 실제
        # 운영 플랫폼에서 backend 테스트가 한 번도 돌지 않습니다.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
        # pyproject 의 requires-python 은 >=3.11,<3.14 입니다. 선언한 상한까지
        # 실제로 검증하기 위해 배포 플랫폼인 ubuntu 에서 3.12, 3.13 을 함께 돌립니다.
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install macOS OpenMP runtime
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install libomp

      # 데이터 자산(모델 가중치, chroma_db)은 저장소에 없으므로 G1 검증은 로컬 전용입니다.
      # E2E 브라우저 테스트는 전용 독립 Job(e2e-browser-test)에서 집중 검증하므로 본 매트릭스에서는 제외합니다.
      # --durations 는 어느 테스트가 오래 걸리는지 로그에 남깁니다. Windows 는 실기가
      # 없어 로컬에서 재현할 수 없으므로 이 출력이 유일한 관측 수단입니다.
      # -p no:cacheprovider 는 러너 캐시 상태에 따라 순서가 달라지는 것을 막습니다.
      # 커버리지 측정과 fail-under 하한(80%) 게이트를 함께 수행합니다.
      - name: Run pytest (SQLite in-memory with coverage)
        run: uv run pytest -q -m "not data_assets and not e2e" --cov=src --cov-report=term-missing --cov-fail-under=80 --durations=25 -p no:cacheprovider

  e2e-browser-test:
    name: Browser E2E Tests (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies & Build SPA
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # E2E 브라우저 테스트 전량(-m e2e)을 독립 실행하며, skip 이 1건이라도 발생하면 실패 처리합니다.
      # 실패 시 스크린샷과 Playwright trace 아티팩트를 보존하기 위해 출력을 캡처하고 종료 코드를 검증합니다.
      - name: Run Playwright E2E Tests
        run: |
          set +e
          OUTPUT=$(uv run pytest tests/e2e -m e2e -v 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Error: E2E pytest failed with exit code $EXIT_CODE."
            exit $EXIT_CODE
          fi
          if echo "$OUTPUT" | grep -E "(SKIPPED|skipped)"; then
            echo "Error: E2E tests contained skipped tests, but 0 skip is required in e2e-browser-test."
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -E "([1-9][0-9]* passed)"; then
            echo "Error: No tests passed in E2E suite."
            exit 1
          fi

      # 실패 시에만 Playwright trace 및 screenshot 아티팩트를 업로드합니다. 성공 시에는 업로드하지 않습니다.
      - name: Upload Playwright Trace and Screenshot Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker 이미지 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 운영 이미지가 uv.lock 기준으로 재현 가능하게 빌드되는지 확인합니다.
      # 이 잡이 없으면 Dockerfile 의 의존성 해석 오류를 배포 시점에야 알게 됩니다.
      - name: Build image
        run: docker build -t refac-bid-box:ci .

      # 설정은 SECRET_KEY 를 필수로 요구합니다(운영 fail-closed). 스모크용
      # 일회성 값을 주입할 뿐 실제 비밀은 CI 에 두지 않습니다.
      - name: Smoke check (앱 임포트)
        run: |
          docker run --rm -e SECRET_KEY=ci-smoke-placeholder-value-not-a-real-secret-0123456789 \
            refac-bid-box:ci python3 -c "import src.app.main"

  mysql-ngram-integration:
    name: MySQL 8 Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_procurement_ngram
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptestpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      # 격리된 MySQL 8 테스트 컨테이너에 전용 스키마와 ngram 인덱스 픽스처를 주입합니다.
      # 운영 procurement DB나 운영 DDL/Alembic 마이그레이션을 전혀 건드리지 않습니다.
      - name: Initialize Isolated MySQL Test Schema
        env:
          MYSQL_PWD: testpassword
        run: |
          mysql -h 127.0.0.1 -u root --default-character-set=utf8mb4 test_procurement_ngram < tests/fixtures/ngram_mysql_init.sql

      # skip 은 성공으로 인정하지 않으며, 최소 1건 이상의 테스트가 실행되어 통과해야 합니다.
      # pytest 실패 시에도 로그가 삼켜지지 않도록 set +e 로 출력을 보존한 뒤 종료 코드를 전파합니다.
      - name: Run MySQL ngram Integration Tests
        env:
          MYSQL_TEST_URL: mysql+pymysql://root:testpassword@127.0.0.1:3306/test_procurement_ngram
        run: |
          set +e
          OUTPUT=$(uv run pytest tests/test_ngram_prefilter_equivalence.py tests/test_mysql_integration_queries.py tests/test_mysql_concurrency.py -m mysql_integration -v 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Error: pytest failed with exit code $EXIT_CODE."
            exit $EXIT_CODE
          fi
          if echo "$OUTPUT" | grep -E "(SKIPPED|skipped)"; then
            echo "Error: mysql_integration tests were skipped."
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -E "([1-9][0-9]* passed)"; then
            echo "Error: No tests passed in mysql_integration."
            exit 1
          fi
