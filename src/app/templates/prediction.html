{% extends "base.html" %}
{% block content %}
<section>
  <h2>AI 낙찰가 예측</h2>
  <form hx-post="/api/v1/predictions/predict" hx-target="#prediction-result" hx-swap="innerHTML">
    <label>추정가격 <input type="number" name="presumed_price" value="500000000" required /></label>
    <label>기초금액 <input type="number" name="base_price" value="495000000" required /></label>
    <label>분야
      <select name="category_code">
        <option value="Thng">물품</option>
        <option value="Servc">용역</option>
        <option value="Cnstwk">공사</option>
        <option value="Frgcpt">외자</option>
      </select>
    </label>
    <button type="submit">예측 실행</button>
  </form>
  <pre id="prediction-result"></pre>
</section>
{% endblock %}
