[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refac_bid_box"
version = "0.1.0"
description = "Refactored BidBox - Procurement Analytics, Hybrid RAG Chatbot, AI Prediction & MLOps Platform"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    # 원본 가중치가 1.8.0에서 직렬화되어 학습·서빙 런타임을 동일 버전으로 고정합니다.
    "scikit-learn==1.8.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
    # 원본 ChromaDB 0.6.3 저장소 형식과 검증 런타임을 동일하게 유지합니다.
    "chromadb==0.6.3",
    "jinja2>=3.1.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "category-encoders>=2.6.4",
    "pydantic[email]>=2.10.0",
    # feature_store parquet 캐싱(src/ml/dataset.py)과 원본 복구 스크립트에 필요합니다.
    # pandas.to_parquet 이 엔진으로 요구합니다. 사후 등재이므로 담당자 확인 필요.
    "pyarrow>=15.0.0",
]


[tool.setuptools]
packages = ["src"]

# ==========================================
# Dev dependencies
# ==========================================
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "bandit>=1.7.0",
    "pre-commit>=3.7.0",
    "mypy>=1.11.0",
]

# ==========================================
# Ruff (Linter + Formatter)
# ==========================================
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "data",
    "chroma_db",
    "migrations",
]

[tool.ruff.lint]
select = [
    "I",     # isort: 임포트 순서
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes: 미사용 import/변수
    "UP",    # pyupgrade: Modern Python 3.11+ syntax
    "S",     # bandit 호환 보안 룰
    "B",     # bugbear: 방어적 코딩 관련
    "SIM",   # simplify: 간결화
    "C4",    # comprehensions: 컴프리헨션 권장
    "RUF",   # Ruff 자체 룰
    "PT",    # pytest 스타일
]
ignore = [
    "E501",  # line too long (formatter가 처리)
    "S101",  # assert 사용 (tests/에서 허용)
    "B008",  # 함수 호출 기본값 (FastAPI Depends() 패턴 허용)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert 허용 (pytest)
    "S106",  # 하드코딩 비밀번호 (테스트 fixture)
    "S108",  # /tmp 경로
    "E402",  # sys.path 조작 후 로컬 import
    "PT006",  # parametrize 첫 인자 문자열 허용
    "PT011",  # pytest.raises match 생략 허용
]
"src/app/api/v1/automation.py" = [
    "B904",  # HTTPException 재발생 시 raise from 생략
]
"src/app/api/v1/bids.py" = [
    "B904",  # HTTPException 재발생 시 raise from 생략
]
"tests/fixtures/level3_reduction_rerun/*.py" = [
    # Level 3 축소 실험의 채점 대상 픽스처입니다. 리뷰어가 찾아야 하는 결함을
    # 의도적으로 심어 둔 파일이므로 내용을 손대면 사전 채점 규칙이 무효가 됩니다.
    "S324",  # md5 사용. 픽스처 원문 보존
    "UP017",  # datetime.timezone.utc 표기. 픽스처 원문 보존
]
"scripts/verify_servc_institution.py" = [
    "S608",  # 검증 전용 질의. 보간값은 모듈 상수뿐이며 외부 입력이 없습니다
]
"scripts/survey_servc_fields.py" = [
    "S608",  # 조사 전용 질의. 보간값은 ALL_FIELDS 상수뿐이며 외부 입력이 없습니다
]
"src/app/core/templating.py" = [
    "S704",  # json.dumps 결과만 Markup 으로 감쌉니다
]
"src/app/services/auth_forms.py" = [
    "S704",  # 보간값을 전부 escape 한 뒤 Markup 으로 감쌉니다
]
"src/app/services/advisory_engine.py" = [
    "RUF012",  # 클래스 가변 기본값 (규칙 테이블)
]
"src/app/services/automation_orchestrator.py" = [
    "RUF005",  # 리스트 연결 대신 언패킹 (가독성 기호)
    "S104",  # 0.0.0.0 은 바인딩이 아니라 로컬 호스트 판별용 비교
]
"src/app/services/automation_callbacks.py" = [
    "S104",  # 0.0.0.0 은 바인딩이 아니라 로컬 호스트 판별용 비교
]
"src/ml/model_registry.py" = [
    "RUF012",  # 클래스 가변 기본값 (모델 레지스트리 테이블)
]
"src/tasks/worker.py" = [
    "RUF012",  # arq WorkerSettings 의 클래스 가변 기본값
]
"scripts/**/*.py" = [
    "S404",  # subprocess import 허용
    "S603",  # subprocess.run 허용
    "S607",  # partial path subprocess 허용
    "S310",  # urllib URL open 허용
    "RUF034",  # 복원 스크립트의 방어적 if-else 허용
]
"src/app/core/config.py" = [
    "S105",  # 기본값 DB 비밀번호 (실제 .env에서 덮어씀)
]
"src/app/services/api_collector.py" = [
    "SIM112",  # G2B serviceKey 환경변수명 유지
    "S314",  # G2B 공공 API 응답 전용 XML 파싱
]
"src/app/services/kb_builder.py" = [
    "S110",  # 컬렉션 삭제 시 예외 무시 허용
    "SIM105",  # contextlib.suppress 강제하지 않음
]
"src/ml/institution_history.py" = [
    "S112",  # timestamp 파싱 예외 continue 허용
]
"tests/test_alembic_setup.py" = [
    "S102",  # env.py 동적 필터 exec 허용
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==========================================
# mypy (정적 타입 검사)
# ==========================================
[tool.mypy]
# 런타임 하한은 3.11 이지만 타입 검사는 3.12 문법으로 해석합니다. 설치된
# numpy 스텁이 3.12 전용 `type` 문을 써서, 3.11 로 해석하면 스텁 파싱에서
# 멈춰 우리 코드를 한 줄도 검사하지 못합니다. 3.11 호환은 ruff 의
# target-version py311 과 CI 의 3.11 테스트가 담당합니다.
python_version = "3.12"
# Pydantic 모델의 기본값과 별칭을 mypy 가 알지 못하면 정상 호출이 전부
# "Missing named argument" 로 잡힙니다. 플러그인은 이미 의존성인 pydantic 에
# 포함돼 있어 새 패키지가 필요하지 않습니다.
plugins = ["pydantic.mypy"]
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
disable_error_code = [
    "union-attr",
    "assignment",
    "attr-defined",
    "return-value",
    "arg-type",
]

# ----------------------------------------------------------------------
# 모듈 한정 mypy override
# ----------------------------------------------------------------------
# call-overload 9건은 전부 같은 원인입니다. 이 저장소의 ORM 모델이 SQLAlchemy
# 2.0 의 Mapped[] 가 아니라 구식 Column(...) 대입으로 선언돼 있어 mypy 가
# 인스턴스 속성을 str 이 아니라 Column[str] 로 봅니다. 근본 원인인 Mapped[]
# 도입은 G1 데이터 무손실에 닿는 별도 과업이므로 이 모듈들에서만 오류 코드를
# 끕니다. 전역 disable_error_code 에 넣지 않습니다.
[[tool.mypy.overrides]]
module = "src.app.models.bids"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "src.app.services.kb_document_builder"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "src.app.services.automation_responses"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "src.app.services.automation_orchestrator"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "src.app.services.tools.bid_prediction_tool"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = "src.app.api.v1.predictions"
disable_error_code = ["call-overload"]


exclude = [
    "data/",
    "chroma_db/",
    ".venv/",
    "migrations/",
]

# ==========================================
# bandit (보안 정적 스캔)
# ==========================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "data", "chroma_db"]
# 규칙을 전역으로 끄면 앞으로 들어올 진짜 위반까지 함께 묻힙니다.
# 개별 오탐은 해당 줄에 `# nosec BXXX - 사유` 로 처리합니다.
skips = ["B101"]  # assert_used
recursive = true

# ==========================================
# pytest
# ==========================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
    "data_assets: 로컬 데이터 자산(모델 가중치, chroma_db)이 있어야 하는 G1 검증. CI 에서는 -m 'not data_assets' 로 제외합니다.",
]
