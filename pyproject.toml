[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refac_bid_box"
version = "0.1.0"
description = "Refactored BidBox - Procurement Analytics, Hybrid RAG Chatbot, AI Prediction & MLOps Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    # 원본 pickle 호환을 위해 고정 (1.7+ 에서 ssh_hist_premium 역직렬화 실패)
    "scikit-learn==1.6.1",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
    "chromadb>=0.6.3",
    "jinja2>=3.1.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "category-encoders>=2.6.4",
    "pydantic[email]>=2.10.0",
    "pyarrow>=15.0.0",
]


[tool.setuptools]
packages = ["src"]

# ==========================================
# Dev dependencies
# ==========================================
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "bandit>=1.7.0",
]

# ==========================================
# Ruff (Linter + Formatter)
# ==========================================
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "data",
    "chroma_db",
    "migrations",
]

[tool.ruff.lint]
select = [
    "I",     # isort: 임포트 순서
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes: 미사용 import/변수
    "UP",    # pyupgrade: Modern Python 3.11+ syntax
    "S",     # bandit 호환 보안 룰
    "B",     # bugbear: 방어적 코딩 관련
    "SIM",   # simplify: 간결화
    "C4",    # comprehensions: 컴프리헨션 권장
    "RUF",   # Ruff 자체 룰
    "PT",    # pytest 스타일
]
ignore = [
    "E501",  # line too long (formatter가 처리)
    "S101",  # assert 사용 (tests/에서 허용)
    "B008",  # 함수 호출 기본값 (FastAPI Depends() 패턴 허용)
    "B904",  # raise from 생략 (프로젝트 전반 관용구)
    "RUF005",  # 리스트 연결 대신 언패킹 (가독성 기호)
    "RUF012",  # 클래스 가변 기본값 (arq WorkerSettings, Pydantic 등)
    "S104",  # 0.0.0.0 바인딩 허용 (개발/헬스체크)
    "S314",  # xml.etree 허용 (G2B API 응답 파싱)
    "S704",  # markupsafe.Markup 허용 (SSR 템플릿)
    "PT006",  # parametrize 첫 인자 문자열 허용
    "PT011",  # pytest.raises match 생략 허용
    "SIM105",  # contextlib.suppress 강제하지 않음
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert 허용 (pytest)
    "S106",  # 하드코딩 비밀번호 (테스트 fixture)
    "S108",  # /tmp 경로
    "E402",  # sys.path 조작 후 로컬 import
]
"scripts/**/*.py" = [
    "S404",  # subprocess import 허용
    "S603",  # subprocess.run 허용
    "S607",  # partial path subprocess 허용
    "S310",  # urllib URL open 허용
    "RUF034",  # 복원 스크립트의 방어적 if-else 허용
]
"src/app/core/config.py" = [
    "S105",  # 기본값 DB 비밀번호 (실제 .env에서 덮어씀)
]
"src/app/services/api_collector.py" = [
    "SIM112",  # G2B serviceKey 환경변수명 유지
]
"src/app/services/kb_builder.py" = [
    "S110",  # 컬렉션 삭제 시 예외 무시 허용
]
"src/ml/institution_history.py" = [
    "S112",  # timestamp 파싱 예외 continue 허용
]
"tests/test_alembic_setup.py" = [
    "S102",  # env.py 동적 필터 exec 허용
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==========================================
# mypy (정적 타입 검사)
# ==========================================
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
disable_error_code = [
    "union-attr",
    "assignment",
    "attr-defined",
    "return-value",
    "arg-type",
]
exclude = [
    "data/",
    "chroma_db/",
    ".venv/",
    "migrations/",
]

# ==========================================
# bandit (보안 정적 스캔)
# ==========================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "data", "chroma_db"]
skips = ["B101"]  # assert_used
recursive = true

# ==========================================
# pytest
# ==========================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
